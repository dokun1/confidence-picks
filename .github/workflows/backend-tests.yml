name: Backend Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      # Include this file so a change to the workflow is validated by the
      # workflow. Without it, editing CI never runs CI, and a broken pipeline
      # merges green -- which is exactly how the six-test subset below went
      # unnoticed for thirteen months.
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: confidence_picks_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d confidence_picks_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install pnpm
      run: npm install -g pnpm
    
    - name: Install dependencies
      working-directory: ./backend
      run: pnpm install --frozen-lockfile
    
    - name: Setup test environment
      working-directory: ./backend
      run: cp .env.test .env
    
    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        sleep 10
        for i in {1..30}; do
          if pg_isready -h localhost -p 5433 -U test_user -d confidence_picks_test; then
            echo "PostgreSQL is ready!"
            break
          fi
          echo "Attempt $i: PostgreSQL not ready yet..."
          sleep 2
        done
    
    - name: Initialize database
      working-directory: ./backend
      run: pnpm run db:init
      env:
        NODE_ENV: test
    
    # The whole suite, not a hand-picked subset.
    #
    # This previously ran only test:structure and test:db -- about 6 of 481 tests
    # -- because routes and server were "temporarily" disabled in Aug 2025 for CI
    # environment issues (ef93aac). Both pass now, and running every file costs
    # roughly the same wall clock as the two that were kept: ~31s locally against
    # the same Postgres 15 service and the same NODE_ENV=test wiring.
    #
    # The subset was the real problem. A green check on 1% of the suite reads as
    # "the backend is fine" while covering almost none of it.
    - name: Run backend tests
      working-directory: ./backend
      run: timeout 600 pnpm test
      env:
        NODE_ENV: test
