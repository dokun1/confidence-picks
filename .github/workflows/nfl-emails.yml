name: Send NFL Emails

# Both jobs are cheap no-ops outside their windows (a reminder needs the day's
# first kickoff within 4 hours; a summary needs the 8am ET hour and a fully
# final week), so running hourly is the whole schedule.
#
# GitHub only fires scheduled workflows from the DEFAULT branch, so this cron
# does nothing until the file is merged to main. Scheduled runs can also fire
# 5-30 minutes late under load, which is why the jobs are window-based rather
# than exact-time.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log what would be sent instead of sending'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install backend dependencies (frozen)
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Send NFL emails
        working-directory: ./backend
        env:
          NODE_ENV: production
          # Load-bearing: games.game_date is a naive timestamp holding UTC and
          # node-pg parses it in the PROCESS zone, so a non-UTC runner would
          # shift every kickoff and fire reminders at the wrong hour.
          TZ: UTC
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEV_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TOKEN_SECRET: ${{ secrets.EMAIL_TOKEN_SECRET }}
          # Sends from the send.* subdomain, not the apex: bulk-mail reputation
          # stays isolated from the root domain, which is what Resend advises
          # and what the verified domain is registered as.
          EMAIL_FROM: 'Confidence Picks <noreply@send.confidence-picks.com>'
          EMAIL_REPLY_TO: hello@noetalabs.tech
          # Scheduled runs send for real. Manual runs honour the checkbox,
          # which defaults to a dry run.
          #
          # This cannot be a bare ${{ inputs.dry_run }}: a schedule event has no
          # inputs, so that renders empty, and EmailService treats anything that
          # is not the literal string "false" as a dry run — every hourly run
          # would silently send nothing.
          EMAIL_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || 'false' }}
          EMAIL_MAX_PER_RUN: '80'
          FRONTEND_BASE_URL: https://www.confidence-picks.com
          API_BASE_URL: https://api.confidence-picks.com
        run: pnpm run email:send

      - name: Summary
        if: always()
        run: echo 'NFL email run completed.' >> $GITHUB_STEP_SUMMARY
